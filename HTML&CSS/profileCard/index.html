
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>

</head>
<body>

    <main class="container">
        <article class="profile-card">

            <img
                src="./assets/profile.jpeg"
                alt="Profile portrait"
                class="profile-image"
            >

            <h1 class="profile-name">Sheikh Fatin Aman</h1>

            <p class="profile-role">Frontend Developer</p>

            <p class="profile-bio">
                I am a Frontend developer and I hope to become a fullstack developer soon.
            </p>

            <nav class="social-links" aria-label="Social links">
                <a href="https://github.com/fatinaman" target="_blank"><i class="fa-brands fa-github"></i></a>
                <a href="https://www.linkedin.com/in/fatin-aman-26b091421/" target="_blank"><i class="fa-brands fa-linkedin"></i>
</a>
            </nav>

        </article>
    </main>

</body>
</html>
